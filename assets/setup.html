<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Підключення ЛКЛАУД</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#15243a;font:16px/1.55 system-ui,-apple-system,sans-serif;padding:56px 20px}main{max-width:580px;margin:auto;background:white;border:1px solid #dce3ed;border-radius:24px;padding:36px;box-shadow:0 12px 40px #1834520a}.brand{font-size:13px;letter-spacing:.14em;color:#315cdf;font-weight:750}h1{font-size:30px;line-height:1.2;margin:14px 0}p{color:#546278}fieldset{padding:0;margin:28px 0 20px;border:0}label{display:block;font-weight:650;margin-bottom:10px}input[type=text]{width:100%;padding:13px;border:1px solid #b7c5d8;border-radius:10px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:#315cdf;color:white;font:650 16px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.note{font-size:13px;margin-bottom:0}#status{margin:20px 0 0;border-radius:12px;padding:14px;background:#f3f6fa}#status:empty{display:none}#status.error{color:#a62626;background:#fff1f1}#status.done{color:#22633e;background:#edf8f1}[hidden]{display:none!important}@media(max-width:540px){body{padding:20px 12px}main{padding:25px}h1{font-size:26px}}
</style></head><body><main>
<div class="brand">ЛКЛАУД</div><h1>Підключіть свою хмару</h1><p>На наступному кроці відкриється сторінка входу та підтвердження доступу.</p>
<form id="setup"><input type="hidden" name="csrf" value="__CSRF__"><fieldset id="choices">
<label for="cloudUrl">Введіть адресу хмари (ЛКЛАУД чи Бухлік)</label><input id="cloudUrl" name="cloudUrl" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="https://cloud.example.edu.ua" required>
</fieldset><button id="submit" type="submit">Продовжити до авторизації</button></form>
<div id="status" role="status" aria-live="polite"></div><p class="note">Пароль вводиться лише на сторінці вашої хмари. Зміна сервера потребує нового входу.</p>
</main><script nonce="__CSRF__">
const form=document.getElementById('setup'),status=document.getElementById('status'),button=document.getElementById('submit'),choices=document.getElementById('choices');
function show(message,phase=''){status.textContent=message;status.className=phase;}
async function poll(){try{const response=await fetch('/status');const data=await response.json();if(data.phase==='done'||data.phase==='error'){show(data.message,data.phase);button.disabled=false;choices.disabled=false;return;}show(data.phase==='checking'?'Перевіряємо сервер…':data.phase==='verifying'?'Вхід завершено. Перевіряємо MCP та список інструментів…':'Адресу збережено. Завершіть вхід у вікні авторизації.');setTimeout(poll,800);}catch{show('Майстер завершив роботу. Запустіть налаштування повторно.','error');button.disabled=false;choices.disabled=false;}}
form.addEventListener('submit',async event=>{event.preventDefault();const body=new URLSearchParams(new FormData(form));button.disabled=true;choices.disabled=true;show('Перевіряємо сервер…');try{const response=await fetch('/configure',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const data=await response.json();if(!response.ok)throw new Error(data.error||'Не вдалося почати налаштування.');poll();}catch(error){show(error.message,'error');button.disabled=false;choices.disabled=false;}});
</script></body></html>
